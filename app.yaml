# Databricks Apps runtime configuration.
#
# uv-based apps get no pre-installed libraries: every dependency comes from
# pyproject.toml + uv.lock. --frozen uses the lock verbatim (never re-resolve
# inside the container); --no-dev leaves pytest/ruff out.
#
# Never set the variables the runtime injects itself: DATABRICKS_APP_PORT,
# DATABRICKS_APP_NAME, DATABRICKS_WORKSPACE_ID, DATABRICKS_HOST,
# DATABRICKS_CLIENT_ID, DATABRICKS_CLIENT_SECRET.
command:
  - "uv"
  - "run"
  - "--frozen"
  - "--no-dev"
  - "python"
  - "app.py"

env:
  - name: EA_BACKEND
    value: "duckdb"            # "databricks" once the Delta backend lands (same DDL)
  - name: EA_DB_PATH
    value: "/tmp/ea.duckdb"    # ephemeral on Apps; the Delta backend is the durable store
  - name: EA_PACK
    value: "packs/higher_education/metamodel.yaml"
  - name: EA_AUTH
    value: "databricks"        # identity from the X-Forwarded-* headers the Apps proxy adds
  - name: EA_AGENT_PROVIDER
    value: "auto"              # anthropic when ANTHROPIC_API_KEY is bound as a secret, else stub
